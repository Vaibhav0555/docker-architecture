name: notes-backend
services:
  notes:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - 3001:80
    environment:
      - PORT=80
      - DB_URL=mongodb://${NOTES_DB_USER}:${NOTES_DB_PASSWORD}@notes-db:27017/${NOTES_DB_NAME}
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
    networks:
      - notes-net
    depends_on:
      - notes-db
  notes-db:
    image: mongo:7.0
    env_file:
      - .env
    volumes:
      - type: volume
        source: notes-data
        target: /data/db
      - type: bind
        source: ./db-config/mongo-init.js
        target: /docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - notes-net

volumes:
  notes-data:

networks:
  notes-net:
