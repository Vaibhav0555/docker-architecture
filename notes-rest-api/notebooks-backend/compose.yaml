name: notebooks-backend
services:
  notebooks:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - 3000:80
    environment:
      - PORT=80
      - DB_URL=mongodb://${NOTEBOOK_DB_USER}:${NOTEBOOK_DB_PASSWORD}@notebooks-db:27017/${NOTEBOOKS_DB_NAME}
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
    networks:
      - notebooks-net
    depends_on:
      - notebooks-db
  notebooks-db:
    image: mongo:7.0
    env_file:
      - .env
    volumes:
      - type: volume
        source: notebooks-data
        target: /data/db
      - type: bind
        source: ./db-config/mongo-init.js
        target: /docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - notebooks-net

volumes:
  notebooks-data:

networks:
  notebooks-net:
